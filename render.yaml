services:
  - type: web
    name: geovixa-backend
    runtime: node
    plan: starter          # $7/mo — always-on, no cold starts (do NOT use "free" for client production)
    region: singapore      # closest region to India with lowest latency on Render; change if needed
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: geovixa-data
      mountPath: /var/data # persistent disk survives redeploys/restarts — ONLY selfie photos live
                            # here now. The database itself is Supabase Postgres (see DATABASE_URL
                            # below) and does NOT live on this disk anymore.
      sizeGB: 1            # 1GB is plenty for selfie photos for ~500 employees; can resize later
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: PORT
        value: 5000
      # REQUIRED — without this the app has no database to talk to. Set this manually in the
      # Render dashboard (Environment tab) to your Supabase "Transaction pooler" connection
      # string. It's declared here with sync:false specifically so a Render Blueprint sync
      # never resets/clears it — leaving it out of this file entirely was the bug that could
      # make it look like employee data "disappears": the service would end up pointed at no
      # database (or a different one) after a redeploy/blueprint sync.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false        # set manually in Render dashboard — never commit real secrets to git
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MANAGER_USERNAME
        sync: false
      - key: MANAGER_PASSWORD
        sync: false
      - key: PROJECT_NAME
        value: Geovixa
      - key: COMPANY_NAME
        value: Geovixa

