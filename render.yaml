services:
  - type: web
    name: mtdc-attendance-backend
    runtime: node
    plan: starter          # $7/mo — always-on, no cold starts (do NOT use "free" for client production)
    region: singapore      # closest region to India with lowest latency on Render; change if needed
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: mtdc-data
      mountPath: /var/data # persistent disk survives redeploys/restarts — DB + photos live here
      sizeGB: 1            # 1GB is plenty for SQLite + selfie photos for ~500 employees; can resize later
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        sync: false        # set manually in Render dashboard — never commit real secrets to git
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MANAGER_USERNAME
        sync: false
      - key: MANAGER_PASSWORD
        sync: false
      - key: PROJECT_NAME
        value: MTDC
      - key: COMPANY_NAME
        value: Krystal
